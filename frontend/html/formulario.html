<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Solicitud de servicio - Muebles LB. Contactanos para armar, desarmar o reparar tus muebles.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="../css/home.css" type="text/css">
    <link rel="stylesheet" href="../css/formulario.css" type="text/css">
    <title>Solicitud de Servicio | Muebles LB</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
        <div class="container">
            <a class="navbar-brand nav-brand" href="home.html">
                <i class="bi bi-house-heart-fill"></i> Muebles LB Especialistas
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-links">
                    <li class="nav-item"><a href="home.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="catalogoProductos.html" class="nav-link">Productos</a></li>
                    <li class="nav-item"><a href="garantia.html" class="nav-link">Garantía</a></li>
                    <li class="nav-item"><a href="pagInspiracion.html" class="nav-link">Inspiración</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="form-section">
            <div class="form-card">

                <span class="hero-badge mx-auto d-flex mb-3" style="width:fit-content;">
                    <i class="bi bi-envelope-paper-heart"></i>
                    Contáctanos
                </span>

                <h1 class="hero-title text-center mb-1" style="font-size:2.1rem;">
                    Formulario de <span>solicitud</span>
                </h1>
                <p class="text-center hero-subtitle mb-4">
                    Solicitar Información sobre <strong style="color:var(--royal-violet);" id="nombre-producto">[nombre
                        del producto]</strong>
                </p>

                <form>
                    <div class="mb-3">
                        <label class="form-label form-custom-label" for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" class="form-control form-custom-input"
                            placeholder="Ej: Pepito Pérez">
                    </div>

                    <div class="mb-3">
                        <label class="form-label form-custom-label" for="direccion">Dirección:</label>
                        <input type="text" id="direccion" name="direccion" class="form-control form-custom-input"
                            placeholder="Calle falsa 123">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-12 col-sm-6">
                            <label class="form-label form-custom-label" for="contacto">Número de contacto:</label>
                            <input type="tel" id="contacto" name="contacto" class="form-control form-custom-input"
                                placeholder="+56 9 XXXX XXXX">
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label form-custom-label" for="pago">Forma de pago preferida:</label>
                            <select id="pago" name="pago" class="form-select form-custom-input">
                                <option value="" disabled selected>Selecciona...</option>
                                <option value="efectivo">Efectivo</option>
                                <option value="transferencia">Transferencia</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label form-custom-label" for="mensaje">Mensaje:</label>
                        <textarea id="mensaje" name="mensaje" class="form-control form-custom-input custom-textarea"
                            placeholder="Escribe tu consulta aquí..." rows="4"></textarea>
                    </div>

                    <button type="button" class="btn-hero-primary w-100 justify-content-center mt-2" id="btn-enviar-ws">
                        <i class="bi bi-send-fill"></i>
                        Enviar solicitud
                    </button>
                </form>

            </div>
        </div>
    </main>

    <footer class="custom-footer">
        <div class="container">
            <div class="footer-inner">
                <span>© 2026 Muebles LB. Todos los derechos reservados.</span>
                <div class="footer-contact">
                    <span><i class="bi bi-envelope-fill me-1"></i>contacto@muebleslb.cl</span>
                    <a href="https://wa.me/56984248526" target="_blank"
                        style="color: inherit; text-decoration: none;"><span><i class="bi bi-whatsapp me-1"></i>+56 9
                            8424 8526</span></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/formulario.js"></script>

</body>

</html>
