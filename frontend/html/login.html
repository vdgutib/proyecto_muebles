<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
    <link rel="stylesheet" href="../css/login.css" type="text/css">
</head>

<body>

  <div class="container">
    <div class="login-container">
      <div class="login-form">
            <h1 class="title">Panel administrativo</h1>
            <h2 class="subtitle">iniciar sesión</h2>

          <form id="login-form">
            <div class="input-group"> 
              <i></i>
              <input type="text" id="email" placeholder="Usuario" required>        
            </div>
            
            <div class="input-group"> 
              <i></i>
              <input type="password" id="password" placeholder="contrasena" required>  
              <i></i>      
            </div>
            <span class="span-pass">Contrasena</span>
            
            <div>
              <input type="checkbox" id="recordarme">
              <label for="recordarme">recordarme</label>
            </div>

            <button type="submit" class="btn-login">Iniciar Sesión</button>
  
          </form>
        </div>

        <div class="login-image">
            <div></div>
        </div>

    </div>

  </div>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
