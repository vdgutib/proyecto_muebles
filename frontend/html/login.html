<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
  <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
  <link rel="stylesheet" href="../css/login.css" type="text/css">
    <link rel="icon" href="../imagenes/logo_empresa.jpeg" type="image/jpeg">
</head>

<body>

  <div class="container">
    <div class="login-container">
      <div class="login-form">
        <h1 class="title">Panel Administrativo</h1>
        <div class="title-divider"></div>
        <h2 class="subtitle">Iniciar sesión</h2>

        <form id="login-form">
          <div class="input-group">
            <i class="bi bi-person-fill"></i>
            <input type="text" id="email" placeholder="Usuario" required>
          </div>

          <div class="input-group">
            <i class="bi bi-lock-fill"></i>
            <input type="password" id="password" placeholder="Contraseña" required>
            <i class="bi bi-eye-fill pass-icon"></i>
          </div>

          <div id="login-feedback" class="feedback-message" style="display: none;"></div>

          <button type="submit" class="btn-login">Iniciar sesión</button>

        </form>
      </div>

      <div class="login-image">
        <img src="../imagenes/imagenLogin.png">
      </div>

    </div>

  </div>
  <script src="../js/bootstrap.bundle.min.js"></script>
  <script src="../js/api.js?v=2"></script>
  <script src="../js/modal.js"></script>
  <script src="../js/login.js?v=2"></script>
</body>

</html>
