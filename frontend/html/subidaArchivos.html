<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel de Subida de Archivos">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="../css/subidaArchivos.css" type="text/css">
    <title>Subida de Archivos | Muebles LB</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
        <div class="container">
            <a class="navbar-brand nav-brand" href="home.html">
                <i class="bi bi-house-heart-fill"></i> Muebles LB Especialistas
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-links">
                    <li class="nav-item"><a href="home.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="catalogoProductos.html" class="nav-link">Productos</a></li>
                    <li class="nav-item"><a href="garantia.html" class="nav-link">Garantía</a></li>
                    <li class="nav-item"><a href="pagInspiracion.html" class="nav-link">Inspiración</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="upload-main">
        <div class="container mb-3" style="max-width: 1100px;">
            <a href="panelAdmin.html" class="btn btn-outline-secondary" style="border-radius: 20px;">
                <i class="bi bi-arrow-left me-2"></i> Volver al Panel
            </a>
        </div>
        <div class="container upload-container">

            <div class="upload-section">
                <h2 class="section-title">Hojas de Cálculo Excel</h2>
                <button class="btn-primary-custom" id="btn-subir-excel">
                    <i class="bi bi-file-earmark-spreadsheet"></i> Subir Excel
                </button>
                <div class="drop-zone" id="drop-zone-excel">
                    Arrastra y suelta tus archivos Excel aquí<br>o haz clic para buscar
                    <input type="file" id="file-excel" accept=".xlsx, .xls" style="display: none;">
                </div>

                <div class="file-list" id="excel-file-list">
                    <!-- Ejemplo de archivo (agregado dinamicamente por JS)
                    <div class="file-item excel-item">
                        <i class="bi bi-file-earmark-excel text-success"></i>
                        <span class="file-name">Listado_Inventario_Junio.xlsx</span>
                        <span class="file-badge success">Completado</span>
                        <span class="file-size">1.2 MB</span>
                        <span class="file-progress-text">Progreso: 100%</span>
                        <div class="progress-bar-container"><div class="progress-bar-fill success" style="width: 100%;"></div></div>
                    </div>
                    -->
                </div>
            </div>

            <div class="upload-section">
                <h2 class="section-title">Imágenes</h2>
                <button class="btn-primary-custom" id="btn-subir-imagenes">
                    <i class="bi bi-images"></i> Subir Imágenes
                </button>
                <div class="drop-zone" id="drop-zone-imagenes">
                    Arrastra y suelta tus imágenes aquí<br>o haz clic para buscar
                    <input type="file" id="file-imagenes" accept="image/*" multiple style="display: none;">
                </div>

                <div class="image-preview-grid" id="image-preview-grid">
                    <!-- Ejemplo de imagen (agregado dinamicamente por JS)
                    <div class="image-thumbnail">
                        <img src="" alt="preview">
                        <div class="img-info">
                            <span class="img-name">Foto_Producto_01.jpg</span>
                            <span class="img-size">2.5 MB</span>
                        </div>
                    </div>
                    -->
                </div>
            </div>
        </div>

        <div class="action-footer">
            <button class="btn-primary-custom" id="btn-finalizar"
                style="padding: 12px 30px; font-size: 1.1rem; border-radius: 30px;">
                Finalizar Carga
            </button>
        </div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/subidaArchivos.js"></script>
</body>

</html>
