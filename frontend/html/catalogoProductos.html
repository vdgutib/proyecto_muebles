<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Catálogo de productos - Muebles LB. Muebles externos, propios y servicios de armado.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="../css/home.css" type="text/css">
    <link rel="stylesheet" href="../css/productos.css" type="text/css">
    <title>Catálogo de Productos | Muebles LB</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
        <div class="container">
            <a class="navbar-brand nav-brand" href="home.html">
                <i class="bi bi-house-heart-fill"></i> Muebles LB Especialistas
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav nav-links">
                    <li class="nav-item"><a href="home.html" class="nav-link">Inicio</a></li>
                    <li class="nav-item"><a href="catalogoProductos.html" class="nav-link active">Productos</a></li>
                    <li class="nav-item"><a href="garantia.html" class="nav-link">Garantía</a></li>
                    <li class="nav-item"><a href="pagInspiracion.html" class="nav-link">Inspiración</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="catalog-main px-2 px-md-3">

            <div class="text-center mb-4">
                <h1 class="catalog-page-title">
                    <i class="bi bi-journal-bookmark-fill me-2"></i>Catálogo de Productos
                </h1>
            </div>

            <div class="d-flex justify-content-center gap-3 mb-5 flex-wrap" id="category-filters">
                <button class="top-cat-btn active" id="btn-todos" onclick="filtrarCategoria('todos')">
                    <i class="bi bi-grid-fill"></i> Todos
                </button>
            </div>

            <div id="dynamic-catalog-container">
            </div>

        </div>
    </main>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content modal-custom-content">
                <div class="modal-header modal-custom-header">
                    <h5 class="modal-title fw-bold" id="m-nombre">Nombre del Producto</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
                        aria-label="Cerrar"></button>
                </div>
                <div class="modal-body text-center p-4">
                    <img id="m-imagen" src="" alt="Producto" class="img-fluid rounded mb-4 modal-custom-img">
                    <div class="d-flex justify-content-around mb-3 text-start bg-light p-3 rounded">
                        <div>
                            <small class="text-muted d-block">Categoría</small>
                            <span id="m-categoria" class="fw-bold"></span>
                        </div>
                        <div class="border-start ps-3">
                            <small class="text-muted d-block">Medidas</small>
                            <span id="m-medidas" class="fw-bold"></span>
                        </div>
                    </div>
                    <h3 class="fw-bold mt-2 modal-custom-price" id="m-precio">$0</h3>
                </div>
                <div class="modal-footer justify-content-center p-3 modal-custom-footer">
                    <a href="formulario.html" id="btn-solicitar-producto"
                        class="btn-solicitar w-100 justify-content-center py-2 modal-custom-btn">
                        <i class="bi bi-send-check"></i> Solicitar este producto
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="custom-footer">
        <div class="container">
            <div class="footer-inner">
                <span>© 2026 Muebles LB. Todos los derechos reservados.</span>
                <div class="footer-contact">
                    <span><i class="bi bi-envelope-fill me-1"></i>contacto@muebleslb.cl</span>
                    <a href="https://wa.me/56984248526" target="_blank"
                        style="color: inherit; text-decoration: none;"><span><i class="bi bi-whatsapp me-1"></i>+56 9
                            8424 8526</span></a>
                </div>
            </div>
        </div>
    </footer>

    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/eventosCatalogo.js"></script>

</body>

</html>
