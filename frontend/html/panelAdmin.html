<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel Administrativo de Muebles LB - Herramienta de Despiece">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="../css/panelAdmin.css" type="text/css">
    <title>Panel Administrativo | Muebles LB</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
        <div class="container">
            <a class="navbar-brand nav-brand" href="panelAdmin.html">
                <i class="bi bi-shield-lock-fill"></i> Muebles LB Admin
            </a>
            <div class="d-flex justify-content-end">
                <button id="btn-logout" class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="admin-container">

        <h1 class="title">Panel Administrativo</h1>

        <main class="admin-dashboard-box">
            
            <div class="row w-100 m-0">
                
                <div class="col-lg-5 left-panel">
                    <h2 class="panel-subtitle">Panel de Administración</h2>
                    
                    <div class="upload-btn-container">
                        <a href="subidaArchivos.html" class="btn-ghost" id="btn-upload">
                            <i class="bi bi-cloud-arrow-up me-2"></i> Ir a Subida de Archivos
                        </a>
                    </div>
                </div>

                <div class="col-lg-7 right-panel">
                    
                    <h3 class="tool-heading text-center mb-3">Herramienta de Despiece</h3>
                    
                    <div class="despiece-container">
                        <div id="alert-container-despiece"></div>
                        
                        <form class="despiece-form" id="form-despiece">
                            
                            <div class="despiece-row mb-3">
                                <label for="input-alto" class="despiece-label">Alto:</label>
                                <div class="input-group" style="width: 160px;">
                                    <input type="number" id="input-alto" name="alto" class="form-control" style="border-color: var(--wisteria-2);" min="0.1" step="0.1" required>
                                    <select class="form-select" id="unidad-alto" style="max-width: 65px; padding-left: 5px; padding-right: 20px; border-color: var(--wisteria-2);">
                                        <option value="m">m</option>
                                        <option value="cm" selected>cm</option>
                                        <option value="mm">mm</option>
                                    </select>
                                </div>
                            </div>

                            <div class="despiece-row mb-3">
                                <label for="input-ancho" class="despiece-label">Ancho:</label>
                                <div class="input-group" style="width: 160px;">
                                    <input type="number" id="input-ancho" name="ancho" class="form-control" style="border-color: var(--wisteria-2);" min="0.1" step="0.1" required>
                                    <select class="form-select" id="unidad-ancho" style="max-width: 65px; padding-left: 5px; padding-right: 20px; border-color: var(--wisteria-2);">
                                        <option value="m">m</option>
                                        <option value="cm" selected>cm</option>
                                        <option value="mm">mm</option>
                                    </select>
                                </div>
                            </div>

                            <div class="despiece-row mb-3">
                                <label for="input-profundidad" class="despiece-label">Profundidad:</label>
                                <div class="input-group" style="width: 160px;">
                                    <input type="number" id="input-profundidad" name="profundidad" class="form-control" style="border-color: var(--wisteria-2);" min="0.1" step="0.1" required>
                                    <select class="form-select" id="unidad-profundidad" style="max-width: 65px; padding-left: 5px; padding-right: 20px; border-color: var(--wisteria-2);">
                                        <option value="m">m</option>
                                        <option value="cm" selected>cm</option>
                                        <option value="mm">mm</option>
                                    </select>
                                </div>
                            </div>

                            <div class="despiece-row mb-3">
                                <label for="input-grosor" class="despiece-label">Grosor:</label>
                                <div class="input-group" style="width: 160px;">
                                    <input type="number" id="input-grosor" name="grosor" class="form-control" style="border-color: var(--wisteria-2);" min="0.1" step="0.1" required>
                                    <select class="form-select" id="unidad-grosor" style="max-width: 65px; padding-left: 5px; padding-right: 20px; border-color: var(--wisteria-2);">
                                        <option value="m">m</option>
                                        <option value="cm">cm</option>
                                        <option value="mm" selected>mm</option>
                                    </select>
                                </div>
                            </div>

                            <div class="d-flex justify-content-center mt-4">
                                <button type="submit" class="btn-ghost" id="btn-calcular">Calcular</button>
                            </div>

                        </form>
                        
                        <div id="despiece-resultados" style="display: none;" class="mt-4"></div>
                    </div>

                </div>
            </div>

        </main>

    </div>
    <script src="../js/bootstrap.bundle.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/panelAdmin.js"></script>
    <script src="../js/despiece.js"></script>
</body>

</html>
