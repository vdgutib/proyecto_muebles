<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Panel Administrativo de Muebles LB - Herramienta de Despiece">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="../css/bootstrap-icons.min.css" type="text/css">
    <link rel="stylesheet" href="../css/panelAdmin.css" type="text/css">
    <title>Panel Administrativo | Muebles LB</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark nav-custom">
        <div class="container">
            <a class="navbar-brand nav-brand" href="panelAdmin.html">
                <i class="bi bi-shield-lock-fill"></i> Muebles LB Admin
            </a>
            <div class="d-flex justify-content-end">
                <button id="btn-logout" class="btn btn-outline-light btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
            </div>
        </div>
    </nav>

    <div class="admin-container">

        <h1 class="title">Panel Administrativo</h1>

        <main class="admin-dashboard-box">

            <header class="admin-header">
                <h2 class="subtitle">Panel de Administración</h2>
            </header>

            <div class="admin-content">

                <section class="admin-left-panel tool-form-card d-flex flex-column justify-content-center">
                    <h3 class="tool-heading mb-4 text-center">Gestión de Archivos</h3>
                    <a href="subidaArchivos.html" class="btn-admin text-decoration-none text-center d-block w-100 py-3 mt-2 mb-3">
                        <i class="bi bi-cloud-arrow-up me-2"></i>
                        Ir a Subida de Archivos
                    </a>
                    <p class="text-muted text-center" style="font-size: 0.95rem;">Sube el Excel de inventario y las imágenes de los productos desde el nuevo panel unificado.</p>
                </section>

                <section class="admin-right-panel">
                    <h3 class="tool-heading">Herramienta de Despiece</h3>

                    <div class="tool-form-card">
                        <form class="despiece-form" id="form-despiece">

                            <div class="form-row">
                                <label for="input-alto">Alto:</label>
                                <input type="number" id="input-alto" name="alto" class="input-form" required>
                            </div>

                            <div class="form-row">
                                <label for="input-ancho">Ancho:</label>
                                <input type="number" id="input-ancho" name="ancho" class="input-form" required>
                            </div>

                            <div class="form-row">
                                <label for="input-profundidad">Profundidad:</label>
                                <input type="number" id="input-profundidad" name="profundidad" class="input-form"
                                    required>
                            </div>

                            <div class="form-row">
                                <label for="input-grosor">Grosor:</label>
                                <input type="number" id="input-grosor" name="grosor" class="input-form" required>
                            </div>

                            <div class="form-actions">
                                <button type="submit" class="btn-admin w-100 mt-2" id="btn-calcular">Calcular Medidas</button>
                            </div>

                        </form>
                        <div id="despiece-resultados" style="display: none;"></div>
                    </div>
                </section>

            </div>
        </main>

    </div>
    <script src="../js/api.js"></script>
    <script src="../js/panelAdmin.js"></script>
    <script src="../js/despiece.js"></script>
</body>

</html>
